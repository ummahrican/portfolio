# Decap CMS Configuration
# Documentation: https://decapcms.org/docs/

backend:
  name: github
  repo: ummahrican/portfolio
  branch: main

# Media handling
media_folder: "static/images/uploads"
public_folder: "/static/images/uploads"

# URL slug settings
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# Editorial workflow (optional - enables draft/review/publish)
# Uncomment to enable:
# publish_mode: editorial_workflow

# Content collections
collections:
  # ============== BLOG POSTS ==============
  - name: "blog"
    label: "📝 Blog Posts"
    label_singular: "Post"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date", "title", "featured"]
    view_filters:
      - label: "Featured Posts"
        field: featured
        pattern: true
      - label: "Drafts"
        field: draft
        pattern: true
    summary: "{{title}} ({{date}})"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        pattern: ['.{10,100}', "Title must be 10-100 characters"]
        hint: "SEO-optimized title (10-100 characters)"
        
      - label: "URL Slug"
        name: "slug"
        widget: "string"
        pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers, and hyphens only"]
        hint: "Used in URL: /blog/your-slug-here (auto-generated from title if left blank)"
        required: false
        
      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        pattern: ['.{50,160}', "Excerpt should be 50-160 characters for SEO"]
        hint: "Brief summary shown in cards and search results (50-160 chars)"
        
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: ""
        
      - label: "Last Modified"
        name: "modified"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
        hint: "Shows content freshness to search engines"
        
      - label: "Author"
        name: "author"
        widget: "string"
        default: "Ahmed"
        
      - label: "Tags"
        name: "tags"
        widget: "list"
        hint: "Press Enter after each tag. Use 3-6 tags for best SEO."
        max: 10
        min: 1
        
      - label: "Featured Post"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Featured posts appear prominently on the homepage hero section"
        
      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        required: false
        hint: "Draft posts won't appear on the live site"
        
      - label: "FAQs (for AI Search/GEO)"
        name: "faqs"
        widget: "list"
        required: false
        hint: "Add 3-5 FAQs to improve visibility in AI search engines (ChatGPT, Perplexity, etc.)"
        collapsed: true
        summary: "{{fields.question}}"
        fields:
          - label: "Question"
            name: "question"
            widget: "string"
            hint: "Common question readers might ask"
          - label: "Answer"
            name: "answer"
            widget: "text"
            hint: "Clear, concise answer (2-4 sentences)"
            
      - label: "SEO Settings (Optional)"
        name: "seo"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - label: "Custom Meta Description"
            name: "description"
            widget: "text"
            required: false
            hint: "Override default excerpt for search results"
          - label: "Custom OG Image"
            name: "image"
            widget: "image"
            required: false
            hint: "Custom Open Graph image (1200x630px recommended)"
          - label: "Canonical URL"
            name: "canonical"
            widget: "string"
            required: false
            hint: "If republished from elsewhere, link to original"
            
      - label: "Content"
        name: "body"
        widget: "markdown"
        hint: "Write your post content in Markdown"
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-two
          - heading-three
          - heading-four
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - code-block
          - image

  # ============== PORTFOLIO ==============
  - name: "portfolio"
    label: "💼 Portfolio"
    label_singular: "Portfolio Item"
    folder: "content/portfolio"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["year", "title", "featured"]
    summary: "{{title}} ({{year}} - {{type}})"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Project or work title"
        
      - label: "URL Slug"
        name: "slug"
        widget: "string"
        pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers, and hyphens only"]
        hint: "Used in URL: /portfolio/your-slug"
        required: false
        
      - label: "Description"
        name: "description"
        widget: "text"
        hint: "Brief description for cards and SEO (1-2 sentences)"
        
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - { label: "Open Source", value: "Open Source" }
          - { label: "Client Work", value: "Client Work" }
          - { label: "Business", value: "Business" }
          - { label: "Enterprise", value: "Enterprise" }
        default: "Open Source"
        
      - label: "Year"
        name: "year"
        widget: "string"
        pattern: ['^[0-9]{4}$', "Enter a 4-digit year"]
        hint: "Year completed (YYYY)"
        
      - label: "Client"
        name: "client"
        widget: "string"
        required: false
        hint: "Client name or 'Personal' for side projects"
        
      - label: "Live URL"
        name: "link"
        widget: "string"
        required: false
        hint: "Link to live project or demo"
        pattern: ['^https?://.+', "Must be a valid URL starting with http:// or https://"]
        
      - label: "GitHub URL"
        name: "github"
        widget: "string"
        required: false
        hint: "Link to GitHub repository (for open source projects)"
        pattern: ['^https://github.com/.+', "Must be a GitHub URL"]
        
      - label: "Tech Stack"
        name: "tech"
        widget: "list"
        hint: "Technologies used (Terraform, AWS, Python, etc.)"
        
      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Featured items appear on homepage"
        
      - label: "FAQs"
        name: "faqs"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.question}}"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
          
      - label: "Detailed Description"
        name: "body"
        widget: "markdown"
        hint: "Full project description, architecture, results, etc."

  # ============== PROJECTS (Micro-SaaS) ==============
  - name: "projects"
    label: "🚀 Projects"
    label_singular: "Project"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["status", "launch_date", "name"]
    view_filters:
      - label: "Live Projects"
        field: status
        pattern: "live"
      - label: "Building"
        field: status
        pattern: "building"
    summary: "{{name}} - {{status}} ({{mrr}})"
    fields:
      - label: "Name"
        name: "name"
        widget: "string"
        hint: "Product name"
        
      - label: "URL Slug"
        name: "slug"
        widget: "string"
        pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers, and hyphens only"]
        hint: "Used in URL: /projects/your-slug"
        required: false
        
      - label: "Tagline"
        name: "tagline"
        widget: "string"
        hint: "One-line value proposition"
        pattern: ['.{10,80}', "10-80 characters for best impact"]
        
      - label: "Description"
        name: "description"
        widget: "text"
        hint: "2-3 sentence overview of what the product does"
        
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "🟢 Live", value: "live" }
          - { label: "🟡 Beta", value: "beta" }
          - { label: "🔵 Building", value: "building" }
          - { label: "⚫ Paused", value: "paused" }
        default: "building"
        
      - label: "MRR (Monthly Recurring Revenue)"
        name: "mrr"
        widget: "string"
        required: false
        hint: "Format: $2,400 or N/A"
        
      - label: "Users"
        name: "users"
        widget: "string"
        required: false
        hint: "Format: 85 teams or 500 users"
        
      - label: "Launch Date"
        name: "launch_date"
        widget: "string"
        required: false
        hint: "Format: YYYY-MM (e.g., 2024-08) or YYYY-Q1"
        
      - label: "Product URL"
        name: "link"
        widget: "string"
        required: false
        hint: "Link to live product"
        pattern: ['^https?://.+', "Must be a valid URL"]
        
      - label: "GitHub URL"
        name: "github"
        widget: "string"
        required: false
        hint: "Link to public repo (if applicable)"
        
      - label: "Tech Stack"
        name: "tech"
        widget: "list"
        hint: "Technologies used to build the product"
        
      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Featured projects appear on homepage"
        
      - label: "FAQs"
        name: "faqs"
        widget: "list"
        required: false
        collapsed: true
        hint: "Common questions about your product"
        summary: "{{fields.question}}"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
          
      - label: "Project Story"
        name: "body"
        widget: "markdown"
        hint: "Tell the story: problem, solution, results, lessons learned"

  # ============== STATIC PAGES ==============
  - name: "pages"
    label: "📄 Pages"
    label_singular: "Page"
    files:
      - label: "About Page"
        name: "about"
        file: "content/pages/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "About" }
          - { label: "Content", name: "body", widget: "markdown" }
      
      - label: "Consulting Page"
        name: "consulting"
        file: "content/pages/consulting.md"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "Consulting" }
          - { label: "Content", name: "body", widget: "markdown" }