<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content Manager | Ummahrican</title>
  
  <!-- Netlify Identity Widget (for GitHub OAuth alternative) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <style>
    /* Custom CMS styling */
    [data-slate-editor] { 
      -webkit-user-modify: read-write !important; 
    }
    
    /* Loading state */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
    
    #cms-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f5f5f5;
    }
    
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading indicator -->
  <div id="cms-loading">
    <div>
      <div class="spinner"></div>
      <p style="margin-top: 1rem; text-align: center; color: #666;">Loading Content Manager...</p>
    </div>
  </div>
  
  <!-- Decap CMS - Will replace loading indicator when ready -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <!-- Custom preview styles -->
  <script>
    // Register preview style
    CMS.registerPreviewStyle('/static/preview.css');
    
    // Hide loading indicator once CMS is ready
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const loading = document.getElementById('cms-loading');
        if (loading) loading.style.display = 'none';
      }, 1000);
    });
  </script>
  
  <!-- Netlify Identity redirect -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
